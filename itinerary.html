<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itinerary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="tm-body">
    <header class="tm-header">
      <div class="tm-header-inner">
        <h1 class="tm-logo">Your Itinerary</h1>
        <nav class="tm-nav" aria-label="Primary navigation">
          <a class="tm-nav-link" href="index.html">Home</a>
          <button class="tm-nav-link tf-export-btn" type="button" id="exportItinerary" data-export-trigger>
            Share itinerary
          </button>
        </nav>
      </div>
    </header>

    <main class="tm-main">
      <section class="tm-panel">
        <h2>Build Your Timeline</h2>
        <button id="addDay" class="tm-button">Add Day</button>
        <div id="itineraryList" class="tm-events-grid"></div>
      </section>

      <section class="tm-panel" id="transportation"></section>

      <section class="tm-panel">
        <h2>Nearby Restaurants, Hotels & Transport</h2>
        <p class="status-message">
          Use this section to discover nearby dining, stays, transport tips, and
          landmark ideas for your trip.
        </p>
        <div class="tm-map-toolbar">
          <label for="daySelect">Add to day</label>
          <select id="daySelect" class="tm-input-inline"></select>
        </div>
        <div class="tm-search-row">
          <input
            id="searchPlaces"
            class="tm-input-inline"
            type="text"
            placeholder="Try café, hotel, taxi, museum, brunch..."
          />
        </div>
        <div class="tm-filter-row">
          <button class="tm-filter-pill active" data-filter="all" type="button">
            All
          </button>
          <button class="tm-filter-pill" data-filter="landmark" type="button">
            Landmarks
          </button>
          <button class="tm-filter-pill" data-filter="restaurant" type="button">
            Restaurants
          </button>
          <button class="tm-filter-pill" data-filter="hotel" type="button">
            Hotels
          </button>
        </div>
        <div id="mapPreview" class="tm-map-preview"></div>
        <div id="pinDetail" class="tm-pin-detail" hidden></div>
        <div id="nearbyPlaces" class="tm-events-grid"></div>
      </section>
    </main>

    <div class="tm-page-actions">
      <a class="tm-page-btn tm-page-btn-ghost" href="planner.html">← Back</a>
      <a class="tm-page-btn" href="planner.html" onclick="localStorage.clear()"
        >+ New Trip</a
      >
    </div>

    <footer class="tm-footer">TravelFlow • Smart plans, smoother trips</footer>

    <script src="api/icons.js"></script>
    <script src="api/places.js"></script>
    <script src="api/export.js"></script>
    <script src="api/itinerary.js"></script>
    <script src="api/transport.js"></script>
  </body>
</html>
